<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem('medical_appearance_last') || 'null'); } catch (_) {}
        const mode = saved && ['light','dark','system'].includes(saved.mode) ? saved.mode : 'light';
        const accent = saved && ['classic','shimadzu-red','clinical-green','corporate-blue','purple','pink','teal'].includes(saved.accent) ? saved.accent : 'classic';
        const effective = mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : (mode === 'system' ? 'light' : mode);
        document.documentElement.dataset.appTheme = effective;
        document.documentElement.dataset.bsTheme = effective;
        document.documentElement.dataset.accentTheme = accent;
    })();
    </script>
    <title>Sign in - MEDICAL SERVICE</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-themes.css') }}?v=19">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-auth.css') }}?v=2">
</head>
<body class="auth-page">

    <div class="login-shell">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-tile"><i class="fa-solid fa-house-medical"></i></div>
            <h1 class="brand-title">MEDICAL SERVICE</h1>
            <p class="brand-subtitle">Scheduler &amp; Management System</p>
        </div>

        <div class="offline-banner" id="offline-banner" role="status">
            <i class="fa-solid fa-wifi"></i>
            <div>You're offline. Reconnect to sign in.</div>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert-login" role="alert">
                    <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                    <div>{{ messages[0] }}</div>
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" id="login-form" novalidate>
            <!-- NEW SECURITY TOKEN FOR HIERARCHY -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if next_target %}
            <!-- Where the user was actually heading before being bounced here.
                 Server-validated as a local path; see resolve_safe_next_target(). -->
            <input type="hidden" name="next" value="{{ next_target }}">
            {% endif %}

            <div class="mb-3">
                <label class="field-label" for="username">Username</label>
                <div class="input-shell">
                    <i class="fa-solid fa-user field-icon"></i>
                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Enter username"
                           autocomplete="username"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           inputmode="text"
                           required>
                </div>
            </div>

            <div class="mb-2">
                <label class="field-label" for="password">Password</label>
                <div class="input-shell">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           autocomplete="current-password"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           required>
                    <button type="button"
                            class="toggle-visibility"
                            id="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false">
                        <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
                <div class="hint-row" id="capslock-hint">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>Caps lock is on</span>
                </div>
            </div>

            <button type="submit" class="btn-signin mt-3" id="signin-button">
                <span id="signin-label">SIGN IN</span>
                <i class="fa-solid fa-right-to-bracket" id="signin-icon"></i>
            </button>
        </form>

        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot password?</a>

        <div class="card-footer-row">
            <div class="status-chip">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Online</span>
            </div>
            <span class="version-tag">&copy; 2026 Medical Service</span>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-password-icon');
        const capsHint = document.getElementById('capslock-hint');
        const form = document.getElementById('login-form');
        const submitButton = document.getElementById('signin-button');
        const submitLabel = document.getElementById('signin-label');
        const submitIcon = document.getElementById('signin-icon');
        const offlineBanner = document.getElementById('offline-banner');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // Password visibility toggle.
        if (toggleButton && passwordInput) {
            toggleButton.addEventListener('click', function () {
                const nowVisible = passwordInput.type === 'password';
                passwordInput.type = nowVisible ? 'text' : 'password';
                toggleButton.setAttribute('aria-pressed', nowVisible ? 'true' : 'false');
                toggleButton.setAttribute('aria-label', nowVisible ? 'Hide password' : 'Show password');
                if (toggleIcon) {
                    toggleIcon.classList.toggle('fa-eye', !nowVisible);
                    toggleIcon.classList.toggle('fa-eye-slash', nowVisible);
                }
                passwordInput.focus();
            });
        }

        // Caps lock warning. getModifierState is unavailable on most touch keyboards,
        // which simply leaves the hint hidden.
        function updateCapsHint(event) {
            if (!capsHint || typeof event.getModifierState !== 'function') { return; }
            capsHint.classList.toggle('is-visible', event.getModifierState('CapsLock'));
        }

        if (passwordInput) {
            passwordInput.addEventListener('keydown', updateCapsHint);
            passwordInput.addEventListener('keyup', updateCapsHint);
            passwordInput.addEventListener('blur', function () {
                if (capsHint) { capsHint.classList.remove('is-visible'); }
            });
        }

        // Connection status.
        function updateConnectionState() {
            const online = navigator.onLine !== false;
            if (offlineBanner) { offlineBanner.classList.toggle('is-visible', !online); }
            if (statusDot) { statusDot.classList.toggle('is-offline', !online); }
            if (statusText) { statusText.textContent = online ? 'Online' : 'Offline'; }
            if (submitButton) {
                submitButton.disabled = !online;
                if (submitLabel) { submitLabel.textContent = online ? 'SIGN IN' : 'OFFLINE'; }
            }
        }

        window.addEventListener('online', updateConnectionState);
        window.addEventListener('offline', updateConnectionState);
        updateConnectionState();

        // Double-submit guard. The timeout re-enables the button so a dropped
        // request can never leave the form permanently stuck.
        if (form && submitButton) {
            form.addEventListener('submit', function () {
                if (submitButton.disabled) { return; }
                submitButton.disabled = true;
                if (submitLabel) { submitLabel.textContent = 'SIGNING IN'; }
                if (submitIcon) {
                    submitIcon.classList.remove('fa-right-to-bracket');
                    submitIcon.classList.add('fa-spinner', 'fa-spin');
                }
                setTimeout(function () {
                    submitButton.disabled = false;
                    if (submitLabel) { submitLabel.textContent = 'SIGN IN'; }
                    if (submitIcon) {
                        submitIcon.classList.remove('fa-spinner', 'fa-spin');
                        submitIcon.classList.add('fa-right-to-bracket');
                    }
                    updateConnectionState();
                }, 12000);
            });
        }
    })();
    </script>
</body>
</html>
