{% extends "layout.html" %}

{% block content %}
<div class="container-fluid py-4 activity-page">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h2 class="h4 mb-0 fw-bold">
                <i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Activity Log
            </h2>
            <p class="text-muted small mb-0" id="activity-page-status" role="status" aria-live="polite">Who did what, and when.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary btn-sm fw-bold" onclick="loadLogs(currentPage)">
                <i class="fa-solid fa-arrows-rotate me-1"></i>Refresh
            </button>
            <button class="btn btn-success btn-sm fw-bold" onclick="exportLogs()">
                <i class="fa-solid fa-file-export me-1"></i>Export CSV
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-3">
            <div class="row g-2 align-items-end">
                <div class="col-lg-3 col-md-6">
                    <label for="filter-q" class="activity-label">Search</label>
                    <input type="search" id="filter-q" class="form-control form-control-sm" placeholder="Action, client, engineer..." oninput="debouncedLoadLogs()">
                </div>
                <div class="col-lg-2 col-md-6">
                    <label for="filter-type" class="activity-label">Category</label>
                    <select id="filter-type" class="form-select form-select-sm" onchange="loadLogs(1)">
                        <option value="">All categories</option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-6">
                    <label for="filter-user" class="activity-label">User</label>
                    <input type="text" id="filter-user" class="form-control form-control-sm" list="activity-user-list" placeholder="Anyone" oninput="debouncedLoadLogs()">
                    <datalist id="activity-user-list"></datalist>
                </div>
                <div class="col-lg-2 col-md-6">
                    <label for="filter-range" class="activity-label">Date</label>
                    <select id="filter-range" class="form-select form-select-sm" onchange="onRangeChange()">
                        <option value="">All time</option>
                        <option value="today">Today</option>
                        <option value="7d">Last 7 days</option>
                        <option value="30d">Last 30 days</option>
                        <option value="custom">Custom...</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-12 d-flex flex-wrap align-items-center gap-3">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="filter-problems" onchange="loadLogs(1)">
                        <label class="form-check-label small fw-bold" for="filter-problems">Problems only</label>
                    </div>
                    <button type="button" class="btn btn-link btn-sm p-0" onclick="toggleMoreFilters()" id="more-filters-btn" aria-expanded="false" aria-controls="more-filters">More filters</button>
                    <button type="button" class="btn btn-link btn-sm p-0 text-muted" onclick="resetFilters()">Reset</button>
                </div>
            </div>

            <div class="row g-2 mt-1" id="custom-range" hidden>
                <div class="col-md-3 col-6">
                    <label for="filter-start" class="activity-label">From</label>
                    <input type="date" id="filter-start" class="form-control form-control-sm" onchange="loadLogs(1)">
                </div>
                <div class="col-md-3 col-6">
                    <label for="filter-end" class="activity-label">To</label>
                    <input type="date" id="filter-end" class="form-control form-control-sm" onchange="loadLogs(1)">
                </div>
            </div>

            <div class="row g-2 mt-1" id="more-filters" hidden>
                <div class="col-md-3 col-6">
                    <label for="filter-action-type" class="activity-label">Action</label>
                    <select id="filter-action-type" class="form-select form-select-sm" onchange="loadLogs(1)">
                        <option value="">All actions</option>
                    </select>
                </div>
                <div class="col-md-3 col-6">
                    <label for="filter-branch" class="activity-label">Branch</label>
                    <select id="filter-branch" class="form-select form-select-sm" onchange="loadLogs(1)">
                        <option value="">All branches</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-transparent border-bottom py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="small fw-bold" id="result-summary" role="status" aria-live="polite">Loading...</div>
            <div class="form-check mb-0" id="routine-wrap" hidden>
                <input class="form-check-input" type="checkbox" id="filter-include-routine" onchange="loadLogs(1)">
                <label class="form-check-label small text-muted" for="filter-include-routine" id="routine-label">Show routine entries</label>
            </div>
        </div>

        <div class="activity-table-wrap">
            <table class="table table-hover align-middle mb-0 activity-table">
                <caption class="visually-hidden">Activity log entries</caption>
                <thead class="table-light small text-muted sticky-top">
                    <tr>
                        <th scope="col" class="ps-3" style="width: 13%;">When</th>
                        <th scope="col" style="width: 12%;">Who</th>
                        <th scope="col" style="width: 18%;">What</th>
                        <th scope="col">Details</th>
                    </tr>
                </thead>
                <tbody id="activity-table-body"></tbody>
            </table>
        </div>

        <div class="card-footer bg-transparent border-top d-flex flex-wrap justify-content-between align-items-center gap-2 py-2">
            <div class="d-flex align-items-center gap-2">
                <label for="per-page" class="small text-muted mb-0">Rows</label>
                <select id="per-page" class="form-select form-select-sm" style="width: 80px;" onchange="loadLogs(1)">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="small text-muted fw-bold" id="page-label"></span>
                <button class="btn btn-outline-secondary btn-sm" id="prev-btn" onclick="changePage(-1)" aria-label="Previous page">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="next-btn" onclick="changePage(1)" aria-label="Next page">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end activity-detail-panel" tabindex="-1" id="activity-detail" data-bs-backdrop="false" data-bs-scroll="true" aria-labelledby="activity-detail-title">
        <div class="offcanvas-header border-bottom">
            <h3 class="h6 fw-bold mb-0" id="activity-detail-title">Entry details</h3>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close details"></button>
        </div>
        <div class="offcanvas-body">
            <div id="activity-detail-body"></div>
            <div id="activity-detail-records"></div>
            <h4 class="activity-label mt-4 mb-2" id="activity-detail-related-title">Related entries</h4>
            <div id="activity-detail-related" aria-live="polite"></div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;
let debounceTimer = null;
let activityLoadController = null;
let activityLoadSequence = 0;
let activityLogsById = {};
let activityDetailController = null;
let activityDetailId = null;

const byId = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString();
const plural = (n, one, many = one + 's') => `${fmt(n)} ${Number(n) === 1 ? one : many}`;

// Form field id -> URL / API parameter.
const FILTER_FIELDS = {
    'filter-q': 'q',
    'filter-type': 'type',
    'filter-user': 'user',
    'filter-range': 'range',
    'filter-start': 'start_date',
    'filter-end': 'end_date',
    'filter-action-type': 'action_type',
    'filter-branch': 'branch',
    'per-page': 'per_page'
};

const CATEGORY_ICONS = {
    Schedule: 'fa-calendar-check', TSR: 'fa-file-signature', Reimbursement: 'fa-receipt',
    'Travel Request': 'fa-plane-departure', 'Travel Liquidation': 'fa-file-invoice-dollar',
    'Cash Advance': 'fa-money-check-dollar', 'Cash Advance Liquidation': 'fa-file-circle-check',
    'Leave Request': 'fa-calendar-minus', 'Stock Inventory': 'fa-barcode',
    Approval: 'fa-route', Accounting: 'fa-calculator', Email: 'fa-envelope',
    Client: 'fa-hospital', Product: 'fa-boxes-stacked', Personnel: 'fa-user-gear',
    Export: 'fa-file-export', Security: 'fa-shield-halved', System: 'fa-circle-info'
};

const CATEGORY_TONES = {
    Approval: 'approval', Accounting: 'approval', Email: 'email',
    Client: 'records', Product: 'records', Personnel: 'records', Export: 'records', Schedule: 'records',
    Security: 'security', System: 'system'
};

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function formatDateLocal(dateObj) {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
}

function rangeDates(range) {
    const days = { today: 0, '7d': 6, '30d': 29 }[range];
    if (days === undefined) return null;
    const end = new Date();
    const start = new Date(end);
    start.setDate(end.getDate() - days);
    return [formatDateLocal(start), formatDateLocal(end)];
}

function buildQueryParams(page = 1) {
    const params = new URLSearchParams();
    params.set('page', page);
    Object.entries(FILTER_FIELDS).forEach(([id, key]) => {
        const value = byId(id).value.trim();
        if (value) params.set(key, value);
    });
    const range = byId('filter-range').value;
    if (range !== 'custom') {
        params.delete('start_date');
        params.delete('end_date');
        const dates = rangeDates(range);
        if (dates) {
            params.set('start_date', dates[0]);
            params.set('end_date', dates[1]);
        }
    }
    if (byId('filter-problems').checked) params.set('severity', 'warning_or_danger');
    if (byId('filter-include-routine').checked) params.set('include_routine', 'true');
    return params;
}

// Keep filters in the address bar so refresh and shared links keep them.
function saveFiltersToUrl(params) {
    const shown = new URLSearchParams(params);
    if (shown.get('range') && shown.get('range') !== 'custom') {
        shown.delete('start_date');
        shown.delete('end_date');
    }
    if (shown.get('page') === '1') shown.delete('page');
    const query = shown.toString();
    history.replaceState(null, '', query ? `?${query}` : location.pathname);
}

function readFiltersFromUrl() {
    const params = new URLSearchParams(location.search);
    Object.entries(FILTER_FIELDS).forEach(([id, key]) => {
        if (params.has(key)) byId(id).value = params.get(key);
    });
    if (!params.has('range') && (params.has('start_date') || params.has('end_date'))) byId('filter-range').value = 'custom';
    byId('filter-problems').checked = params.get('severity') === 'warning_or_danger';
    byId('filter-include-routine').checked = params.get('include_routine') === 'true';
    byId('custom-range').hidden = byId('filter-range').value !== 'custom';
    if (params.get('action_type') || params.get('branch')) toggleMoreFilters(true);
    return Math.max(Number(params.get('page')) || 1, 1);
}

function debouncedLoadLogs() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadLogs(1), 300);
}

function onRangeChange() {
    byId('custom-range').hidden = byId('filter-range').value !== 'custom';
    loadLogs(1);
}

function toggleMoreFilters(show) {
    const panel = byId('more-filters');
    panel.hidden = show === undefined ? !panel.hidden : !show;
    byId('more-filters-btn').setAttribute('aria-expanded', String(!panel.hidden));
}

function populateActivitySelect(id, values) {
    const select = byId(id);
    const currentValue = select.value;
    const defaultOption = select.options[0];
    select.replaceChildren(defaultOption, ...values.map(value => new Option(value, value)));
    select.value = currentValue;
}

async function loadFilterOptions() {
    try {
        const res = await fetch('/get_activity_filter_options');
        if (!res.ok) return;
        const data = await res.json();
        byId('activity-user-list').replaceChildren(...(data.users || []).map(user => new Option(user, user)));
        populateActivitySelect('filter-type', data.categories || []);
        populateActivitySelect('filter-action-type', data.action_types || []);
        populateActivitySelect('filter-branch', data.branches || []);
    } catch (error) {
        console.warn('Unable to load activity filter options', error);
    }
}

function showTableMessage(html, extraClass = 'text-muted') {
    byId('activity-table-body').innerHTML = `<tr class="activity-message-row"><td colspan="4" class="text-center py-5 ${extraClass}">${html}</td></tr>`;
}

function showLoadError(message, page) {
    showTableMessage(`${escapeHtml(message)} <button type="button" class="btn btn-link btn-sm" onclick="loadLogs(${page})">Retry</button>`, 'text-danger');
    byId('result-summary').innerText = message;
}

function renderRow(log) {
    const severity = log.severity || 'normal';
    const tone = CATEGORY_TONES[log.type] || 'workflow';
    const icon = CATEGORY_ICONS[log.type] || CATEGORY_ICONS.System;
    const details = log.display_action || log.action;
    const original = log.action && log.action !== details ? ` title="${escapeHtml(log.action)}"` : '';
    return `
        <tr class="small activity-log-row activity-severity-row-${escapeHtml(severity)}${log.id === activityDetailId ? ' is-selected' : ''}" data-log-id="${log.id}">
            <td class="ps-3 text-nowrap" data-label="When">
                <span class="text-muted">${escapeHtml(log.date)}</span>
                <span class="fw-bold d-block">${escapeHtml(log.time)}</span>
            </td>
            <td data-label="Who">
                <button type="button" class="activity-chip activity-chip-user" onclick="filterBy('filter-user', this.dataset.value)" data-value="${escapeHtml(log.user)}" title="Show only ${escapeHtml(log.user)}">${escapeHtml(log.user)}</button>
            </td>
            <td data-label="What">
                <button type="button" class="activity-chip activity-tone-${tone}" onclick="filterBy('filter-type', this.dataset.value)" data-value="${escapeHtml(log.type)}" title="Show only ${escapeHtml(log.type)}">
                    <i class="fa-solid ${icon} me-1"></i>${escapeHtml(log.type)}
                </button>
                <span class="text-muted ms-1">${escapeHtml(log.action_type || 'Other')}</span>
            </td>
            <td class="activity-details" data-label="Details"${original}>
                <button type="button" class="activity-detail-link" data-log-id="${log.id}">${escapeHtml(details)}</button>
                ${log.branch ? `<span class="activity-chip activity-chip-branch ms-1"><i class="fa-solid fa-location-dot me-1"></i>${escapeHtml(log.branch)}</span>` : ''}
            </td>
        </tr>`;
}

function filterBy(id, value) {
    byId(id).value = value;
    loadLogs(1);
}

async function loadLogs(page = 1) {
    const requestSequence = ++activityLoadSequence;
    if (activityLoadController) activityLoadController.abort();
    activityLoadController = typeof AbortController === 'function' ? new AbortController() : null;
    showTableMessage('<i class="fa-solid fa-spinner fa-spin me-1"></i>Loading...');
    byId('result-summary').innerText = 'Loading...';
    byId('prev-btn').disabled = true;
    byId('next-btn').disabled = true;

    const params = buildQueryParams(page);
    saveFiltersToUrl(params);
    let data;
    try {
        const res = await fetch(`/get_activity_logs?${params.toString()}`, {
            signal: activityLoadController ? activityLoadController.signal : undefined,
            cache: 'no-store'
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
    } catch (error) {
        if (error && error.name === 'AbortError') return;
        if (requestSequence === activityLoadSequence) showLoadError('Unable to load activity logs.', page);
        return;
    }
    if (requestSequence !== activityLoadSequence) return;

    currentPage = data.page;
    totalPages = data.pages || 1;
    const total = Number(data.total || 0);
    const first = total ? (currentPage - 1) * data.per_page + 1 : 0;
    const last = Math.min(currentPage * data.per_page, total);

    const summary = [plural(total, 'entry', 'entries')];
    if (data.problem_count) summary.push(plural(data.problem_count, 'problem'));
    summary.push(plural(data.user_count, 'person', 'people'));
    byId('result-summary').innerText = summary.join(' · ');

    const hidden = Number(data.hidden_routine_count || 0);
    byId('routine-wrap').hidden = !hidden && !byId('filter-include-routine').checked;
    byId('routine-label').innerText = `Show ${plural(hidden, 'routine entry', 'routine entries')}`;

    byId('page-label').innerText = total ? `${fmt(first)}–${fmt(last)} of ${fmt(total)}` : '';
    byId('prev-btn').disabled = currentPage <= 1;
    byId('next-btn').disabled = currentPage >= totalPages;

    if (!data.logs.length) {
        showTableMessage('<i class="fa-solid fa-magnifying-glass me-1"></i>No activity matches these filters.');
        return;
    }
    activityLogsById = Object.fromEntries(data.logs.map(log => [log.id, log]));
    byId('activity-table-body').innerHTML = data.logs.map(renderRow).join('');
}

// "Label: value" segments separated by " | " become field rows; the rest is the headline.
function parseActivityFields(text) {
    const [headline, ...segments] = String(text || '').split(' | ');
    const fields = [];
    const extra = [];
    segments.forEach(segment => {
        const match = segment.match(/^([^:]{1,40}):\s*(.+)$/);
        if (match) fields.push([match[1].trim(), match[2].trim()]);
        else extra.push(segment);
    });
    return { headline: [headline, ...extra].join(' | '), fields };
}

function formatActivityStamp(stamp) {
    const date = stamp ? new Date(stamp.replace(' ', 'T')) : null;
    if (!date || Number.isNaN(date.getTime())) return stamp || '';
    return date.toLocaleString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

function renderActivityDetail(log, decision) {
    const display = log.display_action || log.action;
    const { headline, fields } = parseActivityFields(display);
    const tone = CATEGORY_TONES[log.type] || 'workflow';
    const icon = CATEGORY_ICONS[log.type] || CATEGORY_ICONS.System;
    const rows = [
        ['When', formatActivityStamp(log.timestamp)],
        ['Who', log.user],
        ['Action', log.action_type || 'Other'],
        ...fields,
        // Reason given when the request was rejected or returned (from the approval history).
        ...(decision && decision.reason ? [[`${decision.decision} reason`, decision.reason]] : []),
        ...(decision && decision.by ? [[`${decision.decision} by`, decision.by]] : []),
        ...(log.branch ? [['Branch', log.branch]] : []),
        ...(log.severity === 'danger' ? [['Result', 'Failed']] : log.severity === 'warning' ? [['Result', 'Needs attention']] : [])
    ];
    byId('activity-detail-body').innerHTML = `
        <span class="activity-chip activity-tone-${tone} mb-2"><i class="fa-solid ${icon} me-1"></i>${escapeHtml(log.type)}</span>
        <p class="fw-bold mb-3 activity-detail-headline">${escapeHtml(headline)}</p>
        <dl class="activity-detail-fields mb-0">
            ${rows.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('')}
        </dl>
        ${log.action && log.action !== display ? `<p class="activity-label mt-3 mb-1">Original entry</p><p class="small text-muted mb-0 activity-details">${escapeHtml(log.action)}</p>` : ''}`;
}

// Live fields of the record the entry mentions (as it is now, not when the entry was written).
function renderActivityRecords(records) {
    byId('activity-detail-records').innerHTML = (records || []).map(record => `
        <section class="activity-record-card mt-3">
            <h4 class="activity-label mb-2">Current record · ${escapeHtml(record.label)}</h4>
            <dl class="activity-detail-fields mb-0">
                ${record.fields.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('')}
            </dl>
            ${activityRecordOpenLink(record)}
        </section>`).join('');
}

// The server sends open_url only when the viewer passes the target page's own checks.
function activityRecordOpenLink(record) {
    const url = String(record.open_url || '');
    if (url.startsWith('/') && !url.startsWith('//')) {
        return `<a class="btn btn-sm btn-outline-primary mt-2 activity-record-open" href="${escapeHtml(url)}" target="_blank" rel="noopener">
            <i class="fa-solid fa-arrow-up-right-from-square me-1" aria-hidden="true"></i>${escapeHtml(record.open_label)}</a>`;
    }
    return record.kind === 'Schedule' ? '' : '<p class="small text-muted mt-2 mb-0">Only the assigned approver can open this record.</p>';
}

function renderActivityRelated(data) {
    const byRecord = data.related_by === 'reference';
    byId('activity-detail-related-title').innerText = byRecord
        ? `Same record · ${data.references.join(', ')}`
        : 'Same person, around this time';
    if (!data.related.length) {
        byId('activity-detail-related').innerHTML = `<p class="small text-muted mb-0">${byRecord ? 'No other entries mention this record.' : 'No other entries by this person within 30 minutes.'}</p>`;
        return;
    }
    data.related.forEach(log => { activityLogsById[log.id] = log; });
    byId('activity-detail-related').innerHTML = `<ul class="activity-related-list">${data.related.map(log => `
        <li><button type="button" class="activity-related-item" data-log-id="${log.id}">
            <span class="text-muted">${escapeHtml(log.date)} · ${escapeHtml(log.time)} · ${escapeHtml(log.user)}</span>
            <span class="d-block">${escapeHtml(log.display_action || log.action)}</span>
        </button></li>`).join('')}</ul>`;
}

async function loadActivityRelated(id) {
    if (activityDetailController) activityDetailController.abort();
    activityDetailController = typeof AbortController === 'function' ? new AbortController() : null;
    byId('activity-detail-related').innerHTML = '<p class="small text-muted mb-0"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading...</p>';
    try {
        const res = await fetch(`/get_activity_log_related/${id}`, {
            signal: activityDetailController ? activityDetailController.signal : undefined,
            cache: 'no-store'
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (id !== activityDetailId) return;
        activityLogsById[id] = data.log;
        renderActivityDetail(data.log, data.decision);
        renderActivityRecords(data.records);
        renderActivityRelated(data);
    } catch (error) {
        if ((error && error.name === 'AbortError') || id !== activityDetailId) return;
        byId('activity-detail-related').innerHTML = `<p class="small text-danger mb-0">Unable to load related entries. <button type="button" class="btn btn-link btn-sm p-0" onclick="loadActivityRelated(${id})">Retry</button></p>`;
    }
}

function openActivityDetail(id) {
    id = Number(id);
    const log = activityLogsById[id];
    if (!log) return;
    activityDetailId = id;
    document.querySelectorAll('#activity-table-body .activity-log-row').forEach(row => {
        row.classList.toggle('is-selected', Number(row.dataset.logId) === id);
    });
    byId('activity-detail-related-title').innerText = 'Related entries';
    renderActivityDetail(log);
    renderActivityRecords([]);
    bootstrap.Offcanvas.getOrCreateInstance(byId('activity-detail')).show();
    loadActivityRelated(id);
}

function changePage(direction) {
    const nextPage = currentPage + direction;
    if (nextPage < 1 || nextPage > totalPages) return;
    loadLogs(nextPage);
}

function resetFilters() {
    Object.keys(FILTER_FIELDS).forEach(id => { byId(id).value = ''; });
    byId('per-page').value = '25';
    byId('filter-problems').checked = false;
    byId('filter-include-routine').checked = false;
    byId('custom-range').hidden = true;
    loadLogs(1);
}

function exportLogs() {
    const params = buildQueryParams(currentPage);
    ['page', 'per_page', 'range'].forEach(key => params.delete(key));
    window.location.href = `/export_activity_logs?${params.toString()}`;
}

document.addEventListener('DOMContentLoaded', async () => {
    // Clicking a row opens its details; the Who and What chips keep filtering.
    byId('activity-table-body').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (button && !button.classList.contains('activity-detail-link')) return;
        const row = event.target.closest('.activity-log-row');
        if (row) openActivityDetail(row.dataset.logId);
    });
    byId('activity-detail-related').addEventListener('click', event => {
        const item = event.target.closest('.activity-related-item');
        if (item) openActivityDetail(item.dataset.logId);
    });
    byId('activity-detail').addEventListener('hidden.bs.offcanvas', () => {
        const button = document.querySelector(`#activity-table-body .activity-detail-link[data-log-id="${activityDetailId}"]`);
        activityDetailId = null;
        document.querySelectorAll('#activity-table-body .is-selected').forEach(row => row.classList.remove('is-selected'));
        if (button) button.focus();
    });
    await loadFilterOptions();
    loadLogs(readFiltersFromUrl());
});
</script>
