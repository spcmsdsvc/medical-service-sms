{% extends "_liquidation_base.html" %}

{% block details %}
<div><div class="liq-label">Cash Advance</div><div class="liq-value" id="caNo">—</div></div>
<div><div class="liq-label">Request / Needed</div><div class="liq-value" id="caDates">—</div></div>
<div><div class="liq-label">Liquidation Period</div><div class="liq-value" id="caPeriod">—</div></div>
<div><div class="liq-label">Purpose</div><div class="liq-value" id="caPurpose">—</div></div>
<div><div class="liq-label">Received Reference</div><div class="liq-value" id="receivedReference">—</div></div>
{% endblock %}

{% block page_script %}
<script>
LIQ.hooks.afterRender = function(liq){
    const ref = liq.approved_request_reference || {};
    document.getElementById('caNo').textContent = liq.cash_advance_no || ref.cash_advance_no || '—';
    document.getElementById('caDates').textContent = [ref.request_date, ref.needed_date].filter(Boolean).join(' / ') || '—';
    document.getElementById('caPeriod').textContent = `${ref.liquidation_days || 30} day(s) after receipt`;
    document.getElementById('caPurpose').textContent = ref.purpose || '—';
    document.getElementById('receivedReference').textContent = [ref.payment_method, ref.payment_reference].filter(Boolean).join(' / ') || ref.received_at_label || '—';
};
</script>
{% endblock %}
