<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem('medical_appearance_last') || 'null'); } catch (_) {}
        const mode = saved && ['light','dark','system'].includes(saved.mode) ? saved.mode : 'light';
        const accent = saved && ['classic','shimadzu-red','clinical-green','corporate-blue','purple','pink','teal'].includes(saved.accent) ? saved.accent : 'classic';
        const effective = mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : (mode === 'system' ? 'light' : mode);
        document.documentElement.dataset.appTheme = effective;
        document.documentElement.dataset.bsTheme = effective;
        document.documentElement.dataset.accentTheme = accent;
    })();
    </script>
    <title>Reset password - MEDICAL SERVICE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-themes.css') }}?v=19">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-auth.css') }}?v=2">
</head>
<body class="auth-page">

    <div class="login-shell">
    <div class="login-card">
        <div class="text-center mb-3">
            <div class="brand-tile"><i class="fa-solid fa-lock-open"></i></div>
            <h1 class="brand-title">Set a new password</h1>
            <p class="brand-subtitle">{{ username }}</p>
        </div>

        <p class="auth-intro">
            Choose a new password of at least 8 characters. This link can only be used once.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert-login" role="alert">
                    <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                    <div>{{ messages[0] }}</div>
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" id="reset-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="field-label" for="password">New password</label>
                <div class="input-shell">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="At least 8 characters"
                           autocomplete="new-password"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           minlength="8"
                           required>
                    <button type="button"
                            class="toggle-visibility"
                            id="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false">
                        <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
                <div class="hint-row" id="capslock-hint">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>Caps lock is on</span>
                </div>
            </div>

            <div class="mb-2">
                <label class="field-label" for="confirm_password">Confirm new password</label>
                <div class="input-shell">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="Re-enter password"
                           autocomplete="new-password"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           minlength="8"
                           required>
                </div>
                <div class="hint-row" id="match-hint">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Passwords do not match</span>
                </div>
            </div>

            <button type="submit" class="btn-signin mt-3" id="submit-button">
                <span id="submit-label">UPDATE PASSWORD</span>
                <i class="fa-solid fa-check" id="submit-icon"></i>
            </button>
        </form>

        <a href="{{ url_for('login') }}" class="forgot-link">Back to sign in</a>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const toggleButton = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-password-icon');
        const capsHint = document.getElementById('capslock-hint');
        const matchHint = document.getElementById('match-hint');
        const form = document.getElementById('reset-form');
        const submitButton = document.getElementById('submit-button');
        const submitLabel = document.getElementById('submit-label');
        const submitIcon = document.getElementById('submit-icon');

        if (toggleButton && passwordInput) {
            toggleButton.addEventListener('click', function () {
                const nowVisible = passwordInput.type === 'password';
                passwordInput.type = nowVisible ? 'text' : 'password';
                toggleButton.setAttribute('aria-pressed', nowVisible ? 'true' : 'false');
                toggleButton.setAttribute('aria-label', nowVisible ? 'Hide password' : 'Show password');
                if (toggleIcon) {
                    toggleIcon.classList.toggle('fa-eye', !nowVisible);
                    toggleIcon.classList.toggle('fa-eye-slash', nowVisible);
                }
                passwordInput.focus();
            });
        }

        function updateCapsHint(event) {
            if (!capsHint || typeof event.getModifierState !== 'function') { return; }
            capsHint.classList.toggle('is-visible', event.getModifierState('CapsLock'));
        }

        if (passwordInput) {
            passwordInput.addEventListener('keydown', updateCapsHint);
            passwordInput.addEventListener('keyup', updateCapsHint);
            passwordInput.addEventListener('blur', function () {
                if (capsHint) { capsHint.classList.remove('is-visible'); }
            });
        }

        // Inline match feedback. The server still validates on submit.
        function updateMatchHint() {
            if (!matchHint || !passwordInput || !confirmInput) { return; }
            const confirmValue = confirmInput.value || '';
            const mismatch = confirmValue.length > 0 && confirmValue !== passwordInput.value;
            matchHint.classList.toggle('is-visible', mismatch);
        }

        if (confirmInput) {
            confirmInput.addEventListener('input', updateMatchHint);
        }
        if (passwordInput) {
            passwordInput.addEventListener('input', updateMatchHint);
        }

        if (form && submitButton) {
            form.addEventListener('submit', function () {
                if (submitButton.disabled) { return; }
                submitButton.disabled = true;
                if (submitLabel) { submitLabel.textContent = 'UPDATING'; }
                if (submitIcon) {
                    submitIcon.classList.remove('fa-check');
                    submitIcon.classList.add('fa-spinner', 'fa-spin');
                }
                setTimeout(function () {
                    submitButton.disabled = false;
                    if (submitLabel) { submitLabel.textContent = 'UPDATE PASSWORD'; }
                    if (submitIcon) {
                        submitIcon.classList.remove('fa-spinner', 'fa-spin');
                        submitIcon.classList.add('fa-check');
                    }
                }, 12000);
            });
        }
    })();
    </script>
</body>
</html>
